[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expressions
build-backend = "setuptools.build_meta"

[project]
name = "diurn"
dynamic = ["version"]
description = "Exchange calendars and trading hours from the Diurn API"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Christopher Ariza" }]
maintainers = [{ name = "Christopher Ariza" }]
requires-python = ">=3.12"
# Nothing beyond the standard library; each frame flavor is an extra.
dependencies = []
keywords = ["exchange calendar", "trading hours", "market holidays", "MIC", "ISO 10383"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

[project.optional-dependencies]
pd = ["pandas>=2.0"]
sf = ["static-frame>=5.2"]
dev = [
    "pytest==9.2.0",
    "mypy==2.4.1",
    "ruff==0.17.4",
    "build",
    "twine",
    "pandas==3.1.1",
    "pandas-stubs",
    "static-frame==5.2.1",
]

[project.urls]
Homepage = "https://diurn.io"
Documentation = "https://diurn.io/docs/python/"
Repository = "https://github.com/diurn-io/diurn-py"
Issues = "https://github.com/diurn-io/diurn-py/issues"

[tool.setuptools.dynamic]
version = { attr = "diurn._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diurn = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src/diurn", "tools"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["src/diurn/_generated"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
