name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Publishing a GitHub release builds, checks and uploads to PyPI.
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the classifiers name (pyproject.toml).
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          # The newest version may only be a prerelease on the runners yet.
          allow-prereleases: true
      - run: python -m pip install -e '.[dev]'
      - name: The generated wire layer matches openapi.json
        run: python tools/generate.py --check
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest -q

  package:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Both licenses are in the wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'licenses/LICENSE-MIT'
          python -m zipfile -l dist/*.whl | grep -q 'licenses/LICENSE-APACHE'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  upload:
    name: Publish
    if: github.event_name == 'release'
    needs: [test, package]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
