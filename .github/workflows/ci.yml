name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the classifiers name (pyproject.toml).
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          # The newest version may only be a prerelease on the runners yet.
          allow-prereleases: true
      - run: python -m pip install -e '.[dev]'
      - name: The generated wire layer matches openapi.json
        run: python tools/generate.py --check
      - run: python -m mypy
      - run: python -m pytest -q
